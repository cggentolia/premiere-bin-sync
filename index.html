<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <link rel="stylesheet" href="styles.css" />
    <script src="index.js"></script>
  </head>
  <body>
    <div class="panel">
      <div class="header">
        <div class="title">FOLDER BIN SYNC</div>
        <div class="title-rule"></div>
        <div class="subtitle">
          Mirrors your Project Assets folder into Premiere bins and imports new
          files automatically.
        </div>
      </div>

      <div class="card">
        <div class="card-label">Active Project</div>
        <div id="projectName" class="project">No project open</div>
        <div id="status" class="status"></div>
      </div>

      <div class="card">
        <div class="card-label">Watched Folder</div>
        <div id="folderPath" class="path">No folder selected.</div>
        <button id="chooseBtn" class="btn secondary">Choose Folder…</button>
      </div>

      <div class="card">
        <div class="card-label">Auto-Watch</div>
        <div id="rootPath" class="path">No projects folder set.</div>
        <button id="rootBtn" class="btn secondary">Set Projects Folder…</button>
        <label class="check">
          <input type="checkbox" id="autoWatch" checked />
          <span>Start watching automatically when a project opens</span>
        </label>
        <label class="check">
          <input type="checkbox" id="importExisting" />
          <span>Import files already in the folder</span>
        </label>
      </div>

      <div class="actions">
        <button id="toggleBtn" class="btn cta" disabled>Start Watching</button>
        <button id="scanBtn" class="btn" disabled>Scan Now</button>
      </div>

      <div class="activity-head">
        <span class="card-label">Activity</span>
        <button id="clearLogBtn" class="btn quiet">Clear</button>
      </div>
      <div id="log" class="log"></div>
    </div>
  </body>
</html>
